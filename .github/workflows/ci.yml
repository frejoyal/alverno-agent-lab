name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests and eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (locked, no optional reranker)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Tests with coverage (offline)
        run: uv run pytest -q --cov=alverno_lab --cov-report=term-missing

      - name: Retrieval eval (fake backend) + release gate
        run: >-
          uv run alverno eval --mode retrieval --fake
          --corpus data/corpus
          --dataset data/eval/quality_gold.jsonl
          --thresholds evals/thresholds.yaml
          --out reports/ci

      - name: Privacy detector eval + gate
        run: uv run alverno privacy eval --out reports/ci

      - name: HR retrieval eval (fake) + gate
        run: uv run alverno hr eval --mode retrieval --fake --out reports/ci

      - name: HR full eval (fake) + gate
        run: uv run alverno hr eval --mode full --fake --out reports/ci

      - name: Customer service eval (tools, fake) + gate
        run: uv run alverno service eval --mode tools --fake --out reports/ci

      - name: Customer service eval (full, fake) + gate
        run: uv run alverno service eval --mode full --fake --out reports/ci

      # Nothing is uploaded unless both scans find no canary: the HR gold set (default
      # dataset), then the HR, customer service and maintenance gold sets together (ADR
      # 0015). Holdouts never enter CI.
      - name: Canary scan before upload
        id: canary_scan
        if: always()
        run: uv run alverno privacy scan reports/ci

      - name: Canary scan of the module 3 gold sets before upload
        id: ops_canary_scan
        if: always()
        run: >-
          uv run alverno privacy scan reports/ci
          --dataset data/eval/hr_gold.jsonl
          --dataset data/eval/svc_gold.jsonl
          --dataset data/eval/maint_gold.jsonl

      - name: Upload eval reports
        if: >-
          always() && steps.canary_scan.outcome == 'success'
          && steps.ops_canary_scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-reports
          # The eval access logs stay out of the artifact (EFVP: reports without them); every
          # eval, the customer service one included, writes them to reports/ci/access/.
          path: |
            reports/ci/
            !reports/ci/access/
          if-no-files-found: ignore
