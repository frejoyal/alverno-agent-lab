[project]
name = "alverno-agent-lab"
version = "0.1.0"
description = "Local-first quality agent (hybrid RAG + LangGraph + evals) for a fictional Quebec metal fabrication SME."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Frédéric Joyal" }]
keywords = ["rag", "langgraph", "ollama", "evaluation", "quality-management"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "langgraph>=1.0",
    "langsmith>=0.4",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]

[project.urls]
Homepage = "https://github.com/frejoyal/alverno-agent-lab"
Repository = "https://github.com/frejoyal/alverno-agent-lab"
Issues = "https://github.com/frejoyal/alverno-agent-lab/issues"

[project.scripts]
alverno = "alverno_lab.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alverno_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer declares options as call defaults by design.
"src/alverno_lab/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "rank_bm25.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["alverno_lab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
