    n_canary_items: 13
    n_canary_types: 7
    hit_at_1: 0.94
    hit_at_3: 0.97
    mrr: 0.95
    context_recall: 0.94
    trap_refusal_accuracy: 0.85
  max:
    screen_false_block_rate: 0.06
    pi_over_refusal: 0.0
    backend_canary_hits: 0
    artifact_canary_hits: 0
    error_rate: 0.0
    false_answer_rate: 0.15
    over_refusal_rate: 0.03

hr-full-fake:
