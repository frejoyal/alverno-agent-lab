# Rôles fictifs de Fabrications Alverno inc. et effectifs par quart (jour / soir).
# Totaux alignés sur docs/company.md : 118 personnes ; production 78 (46 de jour, 32 de soir).
# Aucun nom de personne : des rôles seulement. Schéma (spécification §3) :
# departments: [{name, total, roles: [{id, aliases, day, evening}]}] ; le libellé de chaque
# rôle est noté en commentaire. Les alias servent au repérage des mentions
# de rôle (minuscules, accents conservés ; le code les normalise).
# Petit groupe : un rôle dont l'effectif total est inférieur à 5 (convention du labo, k = 5).
departments:
  - name: "Direction et administration"
    total: 12
    roles:
      - id: presidente
        # Libellé : présidente
        aliases: ["présidente", "président", "présidence"]
        day: 1
        evening: 0
      - id: directeur_finances_administration
        # Libellé : directeur des finances et de l'administration
        aliases:
          - "directeur des finances et de l'administration"
          - "directrice des finances et de l'administration"
          - "directeur des finances"
          - "directrice des finances"
          - "directeur financier"
          - "directrice financière"
        day: 1
        evening: 0
      - id: directrice_rh
        # Libellé : directrice des ressources humaines
