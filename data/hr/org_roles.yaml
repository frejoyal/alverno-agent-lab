        day: 3
        evening: 0
      - id: agents_approvisionnement
        # Libellé : agents d'approvisionnement
        aliases: ["agent d'approvisionnement", "agente d'approvisionnement", "agents d'approvisionnement", "agentes d'approvisionnement", "approvisionneur", "approvisionneuse"]
